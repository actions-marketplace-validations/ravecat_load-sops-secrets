name: Test action

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash --noprofile --norc -eo pipefail {0}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:dist

      - name: Prepare synthetic fixture
        id: fixture
        run: node integration/prepare.js

      - name: Load secrets through the action metadata
        id: sops
        uses: ./
        with:
          file: ${{ steps.fixture.outputs.file }}
        env:
          SOPS_AGE_KEY_FILE: ${{ steps.fixture.outputs.key }}

      - name: Verify outputs in the next step
        env:
          DEMO_SECRET: ${{ steps.sops.outputs.demo_secret }}
          MULTILINE: ${{ steps.sops.outputs.multiline }}
          ALL_OUTPUTS: ${{ toJSON(steps.sops.outputs) }}
        run: node integration/verify.js

      - name: Remove synthetic fixture
        if: ${{ always() && steps.fixture.outputs.directory != '' }}
        env:
          FIXTURE_DIRECTORY: ${{ steps.fixture.outputs.directory }}
        run: rm -rf -- "${FIXTURE_DIRECTORY:?}"
